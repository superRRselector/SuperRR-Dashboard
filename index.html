function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function n(v,d=1){return (v===null||v===undefined||!Number.isFinite(Number(v)))?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});}
function pct(v,d=0){return v===null||v===undefined?'—':n(v*100,d)+'%';}

function scatter(players){const W=850,H=325,L=65,R=22,T=26,B=45;const maxX=Math.max(...players.map(p=>p.pressureBalls))*1.12,maxY=Math.max(...players.map(p=>p.rating),1)*1.13,minY=Math.min(0,...players.map(p=>p.rating))-2;
 const X=x=>L+x/maxX*(W-L-R),Y=y=>H-B-(y-minY)/(maxY-minY)*(H-T-B);let a=[];for(let i=0;i<5;i++){let yy=minY+(maxY-minY)*i/4;a.push(`<line x1="${L}" y1="${Y(yy)}" x2="${W-R}" y2="${Y(yy)}" stroke="#2a3c55" stroke-dasharray="2 6"/><text x="${L-10}" y="${Y(yy)+4}" text-anchor="end" fill="#8198b4" font-size="11">${n(yy,0)}</text>`)}for(let i=0;i<5;i++){let xx=maxX*i/4;a.push(`<text x="${X(xx)}" y="${H-17}" text-anchor="middle" fill="#8198b4" font-size="11">${n(xx,0)}</text>`)}a.push(`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#70839e"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#70839e"/><text x="${W/2}" y="${H-1}" text-anchor="middle" fill="#8ca0bc" font-size="12">High-pressure delivery events</text>`);
 players.filter(p=>!p.top10).forEach(p=>a.push(`<circle cx="${X(p.pressureBalls)}" cy="${Y(p.rating)}" r="4" fill="#58718e" opacity=".65"><title>${E(p.name)} | ${n(p.rating,1)} rating | ${p.pressureBalls} events</title></circle>`));

function rankingRows(){let pool=selectPlayers();if(S.topOnly)pool=pool.filter(p=>p.top10);const search=S.search.toLowerCase();if(search)pool=pool.filter(p=>p.name.toLowerCase().includes(search));switch(S.order){case 'rating':pool.sort((a,b)=>b.rating-a.rating);break;case 'exposure':pool.sort((a,b)=>b.pressureBalls-a.pressureBalls);break;case 'stability':pool.sort((a,b)=>b.pTop10-a.pTop10);break;default:pool.sort((a,b)=>a.rank-b.rank)}

A player may score well despite a worse raw pressure rate when the underlying delivery situations were materially harder.</div>`;}
function compBars(p,mx){const mxval=Math.max(1,mx);return `<div class="comp-card"><h3>${E(p.name)}</h3><div class="fine">${p.top10?'Main list #'+p.rank:'Eligible pool #'+p.rank}</div>${[["Conservative rating",p.rating,mxval,n(p.rating,1)],["Pressure events",p.pressureBalls,155,String(p.pressureBalls)],["Bootstrap top-10 frequency",p.pTop10,1,pct(p.pTop10,1)],["Pressure matches",p.pressureMatches,14,String(p.pressureMatches)],["Smoothed positive-match indicator",p.positiveFraction,1,pct(p.positiveFraction,0)]].map(([l,v,max,t])=>`<div class="comp-row"><div class="comp-label"><span>${l}</span><strong>${t}</strong></div><div class="comp-bar"><span style="width:${Math.max(0,Math.min(100,v/max*100))}%"></span></div></div>`).join('')}<div class="fine">Pressure ${p.role==='bat'?'strike rate':'economy'}: <b>${n(p.pressureStat,1)}</b> · Ordinary: <b>${n(p.normalStat,1)}</b></div></div>`;}
function evidenceTable(player){let rr=DATA.matches.filter(m=>m.player===player.name&&m.role===player.role).sort((a,b)=>b.date.localeCompare(a.date));let worth=rr.length?rr.reduce((acc,r)=>acc+r.value,0):null;return `<div class="card"><div class="card-title"><h3>Match-by-match pressure evidence</h3><span class="tag">${rr.length} records</span></div><p class="fine">Every listed row aggregates only the selected pressure deliveries in that match. Negative adjusted value is retained, not hidden.</p><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Opponent</th><th>Events</th><th>${player.role==='bat'?'Batter runs':'Runs conceded'}</th><th>${player.role==='bat'?'Outs':'Wickets'}</th><th>Adjusted value*</th></tr></thead><tbody>${rr.map(m=>`<tr><td>${E(m.date)}</td><td title="${E(m.opponent)}">${E(m.opponent)}</td><td>${m.balls}</td><td>${m.runs}</td><td>${m.wickets}</td><td class="${m.value>=0?'positive':'negative'}">${m.value>=0?'+':''}${n(m.value,1)}</td></tr>`).join('')||'<tr><td colspan="6">Match ledger unavailable in this prior V2 source. See role or borderline diagnostics.</td></tr>'}</tbody></table></div><p class="fine" style="margin:11px 0 0">*Context-adjusted run-equivalent value on selected deliveries. The panel reflects the earlier V2 event-value ledger, which V2.2 reuses for players; Rinku’s matches come from the V2.2 borderline ledger.</p></div>`;}
function playerLab(){const p=playerByName(S.selected[S.role]);const aa=playerByName(S.comp[S.role][0]),bb=playerByName(S.comp[S.role][1]);return frame(heading('02 / EXPLORATORY SCOUTING','Player Intelligence Lab','Inspect any qualifying player, compare two candidates in the same role, and trace performance back to pressure-exposed matches.',roleSwitch())+`<div class="toolbar"><div class="filters"><span class="small-strong">Scouting card</span><select id="profilePlayer" class="select">${playerOptions(S.role,p?.name)}</select></div><span class="fine">Player counts and pressure roles depend on the 2022 delivery file only.</span></div><div class="grid-asym"><div class="card">${playerCard(p)}</div><div class="card"><div class="card-title"><h3>Head-to-head comparison</h3><span class="tag pink">SAME ROLE</span></div><div class="filters" style="margin-bottom:14px"><select id="compareA" class="select" aria-label="First comparison player">${playerOptions(S.role,aa?.name)}</select><select id="compareB" class="select" aria-label="Second comparison player">${playerOptions(S.role,bb?.name)}</select></div><div class="vs-grid">${aa?compBars(aa,Math.max(aa.rating,bb?.rating||0)):''}${bb?compBars(bb,Math.max(aa?.rating||0,bb.rating)):''}</div><p class="fine" style="margin-top:14px">Higher conservative rating does not imply superiority on every cricket skill. For bowling, a lower raw economy is better, while the model rating rewards expected-vs-actual performance adjusted for the situation.</p></div></div><div class="section">${evidenceTable(p)}</div>`);}
function roleScouting(){let names=Object.keys(DATA.roles).filter(n=>S.role==='bat'?n.includes('batter')||n==='Collapse rescue'||n==='Late-overs finisher':n.includes('bowler')||n.includes('controller')||n.includes('defender')||n.startsWith('Powerplay'));if(!names.includes(S.roleName))S.roleName=names[0];let list=DATA.roles[S.roleName]||[],def=list[0]?.definition||'';return frame(heading('03 / SITUATION-SPECIFIC SKILL','Role Scouting','Aggregate rankings tell us who; role splits help explain how. These are exploratory diagnostics, not a second ranking to add on top of the main score.',roleSwitch())+`<div class="pillrow">${names.map(x=>`<button class="role-pill ${x===S.roleName?'active':''}" data-role-name="${E(x)}">${E(x)}</button>`).join('')}</div><div class="role-definition">${E(def)}</div><div class="grid-asym"><div class="card"><div class="card-title"><h3>${E(S.roleName)} · role leaderboard</h3><span class="tag">${list.length} qualified candidates shown</span></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Events</th><th>Matches</th><th>Role score</th><th>Evidence tier</th></tr></thead><tbody>${list.map(x=>`<tr><td class="rank-strong">${x.rank}</td><td><button class="player-link" data-player="${E(x.name)}" data-player-role="${x.kind}">${E(x.name)}</button></td><td>${x.n}</td><td>${x.matches}</td><td><strong>${n(x.score,1)}</strong></td><td>${E(x.tier)}</td></tr>`).join('')}</tbody></table></div><p class="fine" style="margin-top:15px">Screen: ≥20 role deliveries and ≥3 matches. Established-sample label: ≥40 deliveries and ≥5 matches. Role scores are not directly comparable across role groups.</p></div><div class="card"><div class="kicker">SCOUT NOTEBOOK</div><h3>What this role tells us</h3><p>${S.roleName==='Collapse rescue'?'This tests response to early or middle-innings wicket loss. It rewards surviving and scoring above expectation while the batting side is destabilized.':S.roleName==='Late-overs finisher'?'This focuses on late innings; unlike pure strike-rate rankings, it retains dismissal cost and compares run output with the phase-specific peer expectation.':S.roleName==='Demanding-chase batter'?'This subset captures demanding but still contestable chases, where acceleration has greater consequence. Small samples mean the result is a specialist watchlist.':S.roleName==='Close-chase defender'?'Close defences distinguish the runs available to defend from generic high required-run-rate situations. The opposing batting team must still be in the contest.':S.roleName.startsWith('Powerplay')?'Important: all powerplay events measure phase skill, but they are not all classified as high pressure. This is expressly NOT a clutch-specific ranking.':S.roleName==='Middle-overs controller'?'This measures wicket-taking and run restriction above peer expectation during the middle overs, conditioned on the pressure set.':'Death-over bowling is difficult in many different ways. The model focuses on match-state impact, not automatically rewarding every late delivery.'}</p><div class="note warn"><strong>Do not overclaim:</strong> Specialist role scores are exploratory and may rely on as few as 20 deliveries and 3 matches. They should support, not override, the reliability-based overall top 10.</div><div class="divider"></div><h3>Why role scouting matters</h3><p>Arshdeep Singh ranks as a notable close-chase specialist even though he sits just outside the overall bowling top 10. Rahul Tewatia offers a different finishing profile from a collapse-rescue batter. We do not force specialist-only evidence into the overall ordering.</p></div></div>`);}
function pressureCaseCard(c){return `<div class="incident"><div class="stamp">MATCH ${c.match} · INNINGS ${c.innings}</div><h3>${E(c.title)}</h3><div class="outcome">${c.score}</div><div class="prestate">${c.remaining} legal balls left ${c.need!==null?' · '+n(c.need,0)+' needed':''}${c.rrr!==null?' · RRR '+n(c.rrr,1):''}</div><div class="pressure-split"><div><small class="muted">BATTER PRESSURE</small><div class="split-num pink">${n(c.bat,1)}</div><div class="meter pink"><i style="width:${c.bat}%"></i></div></div><div><small class="muted">BOWLER PRESSURE</small><div class="split-num cyan">${n(c.bowl,1)}</div><div class="meter cyan"><i style="width:${c.bowl}%"></i></div></div></div><div class="fine">At the crease: ${E(c.batter)} · Bowling: ${E(c.bowler)}</div></div>`;}
function matchRoom(){const filtered=DATA.cases.filter(c=>c.role===S.caseRole),top=filtered.slice().sort((a,b)=>b.value-a.value);return frame(heading('04 / DELIVERY-LEVEL CONTEXT','Match Room','Pressure is assigned before the delivery. See how identical overs can carry very different stakes — then inspect verified match examples from the player evidence ledger.')+`<div class="section-title"><h2>Four real pre-ball match states</h2><small>Heuristic pressure scale / 100</small></div><div class="grid2">${DATA.pressureCases.map(pressureCaseCard).join('')}</div><div class="callout"><strong>Cricket interpretation:</strong> A near-impossible chase can create a high run demand for a batter, but the bowling side may already be strongly favoured. Likewise, a first-innings collapse can place substantial pressure on the batter without producing the same pressure for the bowler. These scores are not calibrated win probabilities.</div><div class="section"><div class="page-heading"><div><h2>Scouting tape · actual 2022 performances</h2><p>Curated examples where selected pressure deliveries beat the contextual run expectation. These are case studies, <strong>not</strong> representative samples by themselves.</p></div><div class="switch"><button data-case-role="bat" class="${S.caseRole==='bat'?'active':''}">BATTERS</button><button data-case-role="bowl" class="${S.caseRole==='bowl'?'active':''}">BOWLERS</button></div></div><div class="grid3">${top.map(c=>`<div class="incident"><div class="stamp">${E(c.date)} · ${E(c.competition)} · MATCH ${c.match}</div><h3>${E(c.player)}</h3><div class="fine">versus ${E(c.opponent)}</div><div class="prestate" style="margin:14px 0">First selected state: <strong style="color:#eaf0ff">${E(c.state)}</strong></div><div class="outcome">${c.actual}${S.caseRole==='bowl'?' conceded':' runs'} <span style="font-size:14px;color:#9fb4ce">/ ${c.n} pressure events</span></div><div class="kpi-flex"><span class="kpi-chip">Expected runs: <b>${n(c.expected,1)}</b></span><span class="kpi-chip">${S.caseRole==='bowl'?'Bowler wickets':'Dismissals'}: <b>${c.wickets}</b></span><span class="kpi-chip">Run-equivalent value: <b class="${c.value>=0?'positive':'negative'}">${c.value>=0?'+':''}${n(c.value,1)}</b></span></div></div>`).join('')}</div></div><div class="section note">The expected-runs figure is calculated for the <em>selected high-pressure deliveries</em>, not for the player's entire innings or spell. The run-equivalent contribution also includes modeled dismissal or wicket effects, so it need not equal the raw difference between actual and expected runs.</div>`);}
function reliability(){const bat=topPlayers('bat'),bowl=topPlayers('bowl');let table=(ps)=>`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Pressure events</th><th>Matches</th><th>Resample frequency</th></tr></thead><tbody>${ps.map(p=>`<tr><td class="rank-strong">${p.rank}</td><td>${E(p.name)}</td><td>${p.pressureBalls}</td><td>${p.pressureMatches}</td><td>${pct(p.pTop10,1)}</td></tr>`).join('')}</tbody></table></div>`;return frame(heading('05 / MODEL VALIDATION','Reliability & Uncertainty','Our aim is repeatability, not a single career highlight. The leaderboard combines a lower-bound adjustment, pressure exposure and consistent results across matches.')+`<div class="stats">${statCard('800','MATCH-CLUSTER RESAMPLES','◇')}${statCard('30','ORDINARY-BASELINE PRIOR BALLS','◈')}${statCard('25%','PRESSURE TAIL PER ROLE / INNINGS','▤')}${statCard('5','MINIMUM PRESSURE MATCHES','◉')}</div>
<div class="grid2"><div class="card"><div class="card-title"><h3>Batters · top-10 reappearance</h3><span class="tag pink">2022 SAMPLE</span></div>${table(bat)}</div><div class="card"><div class="card-title"><h3>Bowlers · top-10 reappearance</h3><span class="tag pink">2022 SAMPLE</span></div>${table(bowl)}</div></div>
<div class="section grid2"><div class="card"><div class="kicker">SENSITIVITY 01</div><h3>Different pressure definitions change the shortlist</h3><p>In the earlier V2 comparison, selecting the top 20% of pressure events rather than the top 25% retained only <b>6 of 10 batting</b> and <b>7 of 10 bowling</b> players. The result demonstrates model sensitivity; it is not a new V2.2 recomputation.</p><div class="note warn">The exact V2.2 point rankings are preserved in this dashboard. Earlier V2 stress tests appear only as methodological diagnostics, not competing final answers.</div></div><div class="card"><div class="kicker">SENSITIVITY 02</div><h3>Fair ordinary baselines</h3><p>With the chosen ordinary-ball prior of 30, Rinku Singh ranks #6 on the conservative V2.2 list. In point-score-only checks with prior strengths of 15, 30, 60 and 120, he remained within the top 10.</p><div class="note">The prior shrinks an unreliable ordinary-situation <em>context residual</em> toward zero, rather than assuming the player has a zero strike rate or a zero economy.</div></div></div>
<div class="section card"><div class="card-title"><h3>Why we don't publish 'probability of being clutch'</h3><span class="tag warn">EPISTEMIC LIMIT</span></div><div class="grid3"><div><h3>Small match sample</h3><p>Only 73 scored matches. More matches could change the order, especially the lower ranks.</p></div><div><h3>No playoff ball data</h3><p>We cannot validate playoff-specific performance, regardless of how important it would be to auction scouts.</p></div><div><h3>Not a future forecast</h3><p>The bootstrap frequency estimates resampling stability in this dataset. It does not predict 2027 form, retention or auction availability.</p></div></div></div>`);}
function methodology(){return frame(heading('06 / REPRODUCIBLE SCIENCE','Methodology','The full model is intentionally inspectable: pre-delivery match context → pressure classification → run-equivalent outcomes → adjusted player rating → validation.')+`<div class="card"><div class="method-step"><div class="step-badge">01</div><div><h3>Rebuild the pre-delivery state</h3><p class="mb0">Separate legal balls from wides and no-balls; track score, wickets, legal balls left, chase target, required run rate and innings phase before each delivery. Two incomplete/problematic matches (14130, 14156) are excluded from scoring.</p></div></div><div class="method-step"><div class="step-badge">02</div><div><h3>Define batting and bowling pressure separately</h3><p class="mb0">In the first innings: wicket stress, resource pressure, projected par and scoring threat. In chases: run demand, wickets, time urgency and a contestability heuristic. Retain the top 25% within each role–innings combination. The pressure label uses no information from the ball outcome itself.</p></div></div><div class="method-step"><div class="step-badge">03</div><div><h3>Estimate peer expectations without same-match leakage</h3><p class="mb0">Use leave-one-match-out expectations among comparable deliveries, conditioned broadly on format, innings, phase, wickets and chase demand. Compare actual run/wicket output to the peers' expected output, keeping batting and bowling accounts separate.</p></div></div><div class="method-step"><div class="step-badge">04</div><div><h3>Value context-adjusted pressure performance</h3><div class="formula">BATTER = actual batter runs − peer expected runs<br/> &nbsp; − 5 × (striker dismissals − expected striker dismissals)<br/><br/>BOWLER = peer expected conceded runs − actual conceded runs<br/> &nbsp; + 5 × (credited wickets − expected credited wickets)</div><p class="fine">Each value is run-equivalent impact; five runs per wicket is a tested heuristic. Bowler wickets exclude run-outs and retire-outs.</p></div></div><div class="method-step"><div class="step-badge">05</div><div><h3>Rate quality, pressure uplift and consistency</h3><div class="formula"><strong>Ordinary context baseline (V2.2)</strong> = ordinary residual sum / (ordinary events + 30)<br/><strong>Point score</strong> = 100 × [0.75 × pressure mean + 0.25 × uplift]<br/> &nbsp; × n/(n+35) × m/(m+2) × consistency factor<br/><strong>Conservative score</strong> = 0.70 × point score + 0.30 × 20th-percentile bootstrap score</div><p class="fine">n = pressure delivery events; m = pressure-exposed matches. Uplift = high-pressure context-adjusted mean minus shrunk ordinary context-adjusted mean. Scores are unitless within role.</p></div></div><div class="method-step"><div class="step-badge">06</div><div><h3>Enforce evidence and stress-test rankings</h3><p class="mb0">Batters need ≥80 total and ≥30 high-pressure events across ≥5 pressure matches. Bowlers need ≥100 total and ≥35 high-pressure events across ≥5 pressure matches. Recompute scores across 800 match-cluster bootstrap resamples and test sensitivity to alternative assumptions.</p></div></div></div>
<div class="section grid2"><div class="card"><h3>Download & audit</h3><p>The accompanying standalone methodology PDF and reproducible model scripts describe assumptions and limitations. The public dashboard intentionally uses aggregate analytical results, not the six original ball-by-ball and roster files.</p><a class="solid-btn" href="methodology.pdf" download="RR_SupeRR_Methodology_Report.pdf">↓ Methodology PDF</a><button class="ghost-btn" style="margin-left:7px" data-export="top20">↓ Top 20 CSV</button></div><div class="card"><h3>Scope & prohibited inferences</h3><ul><li>Coverage: only 2022 deliveries; later match metadata is not extra performance data.</li><li>There is no delivery-level playoff sample.</li><li>Venue, opponent quality and matchup effects are not fully controlled.</li><li>Pressure and contestability scores are heuristics, not calibrated win probabilities.</li><li>Retired or contracted players can appear: auction eligibility is deliberately not a Round 1 filter.</li><li>Role-specific lists are descriptive and should not be added together.</li></ul></div></div>
<div class="section card"><div class="card-title"><h3>Frequently challenged judge questions</h3><span class="tag">OPEN EACH</span></div><details><summary>Why does a bowler with worse raw pressure economy still rank well?</summary><div class="details-content">Because the model compares outcomes against the expected runs and wicket rates for similarly difficult match states. A bowler facing exceptionally aggressive batters in a difficult phase may concede more than usual while still outperforming contextual expectation. The wicket-value estimate also contributes.</div></details><details><summary>Why is Rinku Singh inside the top 10?</summary><div class="details-content">Our original minimum of 30 ordinary-situation batting deliveries was unfair to specialist finishers. V2.2 uses a 30-ball shrinkage prior on the ordinary context residual and maintains exposure criteria. Rinku's limited 24 ordinary events are flagged rather than treated as a fully reliable baseline.</div></details><details><summary>How do we know this is not one memorable match?</summary><div class="details-content">Scores require at least five pressure-exposed matches, shrink small samples and include an 800-resample match bootstrap. Player Lab also exposes positive and negative match-level residuals, rather than showing only high-scoring highlights.</div></details><details><summary>Why are unavailable or retired players shown?</summary><div class="details-content">This is a historical ranking using the RR-supplied data, not a forecast of the 2027 player pool. No Round 1 ranking rule excludes players based on retirement or contractual status.</div></details></div>`);}
function updateNav(){let nav=Object.entries(PAGE_NAMES).map(([k,v])=>`<button class="nav-btn ${k===S.page?'active':''}" data-page="${k}"><span class="nav-glyph">${PAGE_ICONS[k]}</span>${v}</button>`).join('');document.querySelector('#sideNav').innerHTML=nav;document.querySelector('#mobileNav').innerHTML=Object.entries(PAGE_NAMES).map(([k,v])=>`<button class="${k===S.page?'active':''}" data-page="${k}"><span>${PAGE_ICONS[k]}</span>${v.replace(' ','<br/>')}</button>`).join('');document.querySelector('#crumb').textContent=PAGE_NAMES[S.page];}
function render(resetScroll=false){updateNav();const F={overview,rankings,player:playerLab,roles:roleScouting,match:matchRoom,validation:reliability,method:methodology};document.querySelector('#main').innerHTML=F[S.page]();if(resetScroll)window.scrollTo({top:0,behavior:'instant'});}
function navigate(page){if(PAGE_NAMES[page]){S.page=page;render(true);}}
function downloadCsv(all=false){let rows=all?selectPlayers('bat').concat(selectPlayers('bowl')):topPlayers('bat').concat(topPlayers('bowl'));const keys=['category','rank','player_name','pressure_deliveries','pressure_matches','conservative_rating','bootstrap_top10_pct'];let lines=[keys.join(',')];for(let p of rows){lines.push([p.role==='bat'?'Batter':'Bowler',p.rank,'"'+p.name.replaceAll('"','""')+'"',p.pressureBalls,p.pressureMatches,p.rating,n(p.pTop10*100,2)].join(','));}let blob=new Blob([lines.join('\n')+'\n'],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=all?'RR_V2_2_All_Eligible_Players.csv':'RR_V2_2_Final_Top_20.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-player],[data-role],[data-pool],[data-role-name],[data-case-role],[data-export]');if(!b)return;
 if(b.dataset.page){if(b.dataset.toRole)S.role=b.dataset.toRole;navigate(b.dataset.page);return;}
 if(b.dataset.player){let role=b.dataset.playerRole||S.role;let p=playerByName(b.dataset.player,role);if(p){S.role=role;S.selected[role]=p.name;S.comp[role][0]=p.name;navigate('player');}return;}
 if(b.dataset.role){S.role=b.dataset.role;S.search='';S.order='rank';render();return;}
 if(b.dataset.pool){S.topOnly=b.dataset.pool==='top';render();return;}
 if(b.dataset.roleName){S.roleName=b.dataset.roleName;render();return;}
 if(b.dataset.caseRole){S.caseRole=b.dataset.caseRole;render();return;}
 if(b.dataset.export){downloadCsv(b.dataset.export==='all');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('scatter-player')){let x=e.target;S.role=x.dataset.playerRole;S.selected[S.role]=x.dataset.player;navigate('player');}});
document.addEventListener('change',e=>{let t=e.target;switch(t.id){case 'sortRank':S.order=t.value;render();break;case 'profilePlayer':S.selected[S.role]=t.value;render();break;case 'compareA':S.comp[S.role][0]=t.value;render();break;case 'compareB':S.comp[S.role][1]=t.value;render();break;}});
document.addEventListener('input',e=>{if(e.target.id==='searchPlayers'){S.search=e.target.value;const body=document.querySelector('#rankTable');if(body)body.innerHTML=rankingRows();}});
render();
</script>
